# =========================================================================
# CONFIGURAÇÃO ECLIPSE MOSQUITTO: MDM CORPORATIVO (250 TABLETS)
# =========================================================================

# Persistência de mensagens retidas e QoS
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# 1. Porta interna para comunicação com o Backend API (Fastify)
listener 1883 0.0.0.0
allow_anonymous true

# 2. Porta externa segura (MQTTS com TLS) para conexão direta dos Tablets Android
listener 8883 0.0.0.0
# Certificados Let's Encrypt mapeados pelo Certbot / Caddy
# certfile /mosquitto/certs/fullchain.pem
# keyfile /mosquitto/certs/privkey.pem
# cafile /mosquitto/certs/chain.pem
allow_anonymous true

# Limites de conexão e buffers otimizados para frota de 250 dispositivos
max_connections 500
max_queued_messages 1000
